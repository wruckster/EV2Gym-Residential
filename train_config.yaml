
# 1. Experiment-level settings
experiment:
  run_name: 'ppo_residential_profit_setpoint_tracking' # A descriptive name for this run
  results_dir: 'results'            # Root directory for all outputs
  seed: 42
  device: 'auto'                    # 'auto', 'cuda', or 'cpu'
  
  # Evaluation mode settings
  evaluation:
    enabled: False                   # Set to true to only run evaluation, no training
    replay_dir: 'results/ppo_residential_v2g_20250801_070751/replay_files'           # Directory to look for replay files
    plot_save_name: 'evaluation_plots.png'  # Name for the output plot file

# 2. Environment settings
environment:
  config_file: 'ev2gym/example_config_files/residential_v2g.yaml'
  action_wrapper: 'Rescale_RepairLayer_V2G' # From ev2gym.rl_agent.action_wrappers
  noise_wrapper: ''                     # Optional: from ev2gym.rl_agent.noise_wrappers
  is_verbose: False

# 3. RL agent and algorithm settings
rl:
  # --- Modular components to use ---
  state_function: 'V2G_profit_max_enhanced'      # From ev2gym.rl_agent.state
  reward_function: 'solar_profit_reward_setpoint_tracking' # From ev2gym.rl_agent.reward
  cost_function: ''                     # Optional: from ev2gym.rl_agent.cost

  # --- Tianshou OnpolicyTrainer arguments ---
  # See Tianshou docs for OnpolicyTrainer for all available options
  trainer_args:
    max_epoch: 20  # Extended from 20 for more training
    step_per_epoch: 2048
    step_per_collect: 1024
    repeat_per_collect: 4
    episode_per_test: 5
    batch_size: 128
    show_progress: True
    # Early stopping to prevent policy degradation
    test_in_train: True
    stop_fn: null  # Can add early stopping function here

  # --- Other RL settings ---
  training_num: 4  # Number of parallel environments for training
  test_num: 1      # Number of parallel environments for testing
  buffer_size: 50_000

  # --- PPO-specific arguments ---
  ppo:
    policy_args:
      # See Tianshou docs for PPOPolicy for all available options
      discount_factor: 0.995  # Gamma: how much to value future rewards (0.995 = far-sighted)
      gae_lambda: 0.97        # Generalized Advantage Estimation: balance bias/variance in advantage estimates
      vf_coef: 0.25           # Value function loss coefficient: weight of critic loss in total loss
      ent_coef: 0.05          # Entropy coefficient: encourages exploration (higher = more random actions, increased for smoother control)
      max_grad_norm: 0.5      # Gradient clipping: prevents exploding gradients during training
      eps_clip: 0.2           # PPO clipping parameter: limits policy update size (0.2 = 20% change max)
      dual_clip: null         # Optional: additional clipping for large advantages (null = disabled)
      value_clip: True        # Clip value function updates to prevent large changes
      reward_normalization: False  # Don't normalize rewards (already normalized in reward function)
      action_scaling: False   # Set to False, as Rescale_RepairLayer handles scaling
      action_bound_method: 'clip'  # How to handle out-of-bound actions: clip to valid range
    lr: 0.0001

    # Learning rate schedule (optional but recommended)
    lr_decay: True
    lr_scheduler_type: 'cosine'       # Cosine annealing
    lr_min: 0.00001                   # Minimum learning rate